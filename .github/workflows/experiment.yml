          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run experiment script
        env:
          # OpenAI and Azure keys should be stored in GitHub Secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          MODEL_NAME: 'gpt-4o'   # specify your model name here
        run: |
          python -m research_extractor.scripts.run_experiment \
            --input research_extractor/data/abstract.sample.jsonl \
            --out research_extractor/outputs/results-fake.jsonl \
            --provider 'fake'

      - name: Job summary
        if: always()
        run: |
          echo "## Experiment summary" >> $GITHUB_STEP_SUMMARY
          if [ -f research_extractor/outputs/report-fake.md ]; then
            cat research_extractor/outputs/report-fake.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report-fake.md found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.job }}-${{ github.run_id }}
          path: |
            research_extractor/outputs/results-fake.jsonl
            research_extractor/outputs/metrics-fake.json
            research_extractor/outputs/report-fake.md

