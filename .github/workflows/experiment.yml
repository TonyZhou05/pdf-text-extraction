name: experiment
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - 'research_extractor/**'
      - '.github/workflows/experiment.yml'
      - 'pyproject.toml'

jobs:
  run_dummy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run experiment script (Abstract JSONL)
        env:
          # OpenAI and Azure keys should be stored in GitHub Secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          MODEL_NAME: 'gpt-4o'   # specify your model name here
        run: |
          python -m research_extractor.scripts.run_experiment \
            --input research_extractor/data/abstract.sample.jsonl \
            --output research_extractor/outputs/results-fake.jsonl \
            --provider 'fake'
      
      - name: Run experiment script (PDF Text Directory)
        run: |
          python -m research_extractor.scripts.run_experiment \
            --input research_extractor/data/text/ \
            --output research_extractor/outputs/results-pdf-text-fake.jsonl \
            --input-type 'pdf_text_dir' \
            --provider 'fake'

      - name: Job summary
        if: always()
        run: |
          echo "## Experiment summary" >> $GITHUB_STEP_SUMMARY
          if [ -f research_extractor/outputs/report-fake.md ]; then
            cat research_extractor/outputs/report-fake.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report-fake.md found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## PDF Text Directory Test (Fake)" >> $GITHUB_STEP_SUMMARY
          if [ -f research_extractor/outputs/results-pdf-text-fake.jsonl ]; then
            echo "PDF text directory processing completed successfully with fake provider." >> $GITHUB_STEP_SUMMARY
          else
            echo "PDF text directory processing may have failed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.job }}-${{ github.run_id }}
          path: |
            research_extractor/outputs/results-fake.jsonl
            research_extractor/outputs/metrics-fake.json
            research_extractor/outputs/report-fake.md
            research_extractor/outputs/results-pdf-text-fake.jsonl

  integration:
    needs: run_dummy
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY || '' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
      - name: Run experiment script (Azure)
        if: ${{ env.AZURE_OPENAI_API_KEY != '' && env.AZURE_OPENAI_ENDPOINT != '' }}
        env:
          MODEL_NAME: 'gpt-4o'
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          python -m research_extractor.scripts.run_experiment \
            --input research_extractor/data/abstract.sample.jsonl \
            --output research_extractor/outputs/results-azure.jsonl \
            --input-type 'abstract_jsonl' \
            --provider 'azure'
      
      - name: Run experiment script (PDF Text Directory - Azure)
        if: ${{ env.AZURE_OPENAI_API_KEY != '' && env.AZURE_OPENAI_ENDPOINT != '' }}
        env:
          MODEL_NAME: 'gpt-4o'
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          python -m research_extractor.scripts.run_experiment \
            --input research_extractor/data/test/ \
            --output research_extractor/outputs/results-pdf-text-azure.jsonl \
            --input-type 'pdf_text_dir' \
            --provider 'azure'
      
      
      - name: Job summary
        if: always()
        run: |
          echo "## Experiment summary" >> $GITHUB_STEP_SUMMARY
          if [ -f research_extractor/outputs/report-azure.md ]; then
            cat research_extractor/outputs/report-azure.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report-azure.md found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## PDF Text Directory Test (Azure)" >> $GITHUB_STEP_SUMMARY
          if [ -f research_extractor/outputs/results-pdf-text-azure.jsonl ]; then
            echo "PDF text directory processing completed successfully with Azure provider." >> $GITHUB_STEP_SUMMARY
          else
            echo "PDF text directory processing may have failed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.job }}-${{ github.run_id }}
          path: |
            research_extractor/outputs/results-azure.jsonl
            research_extractor/outputs/metrics-azure.json
            research_extractor/outputs/report-azure.md
            research_extractor/outputs/results-pdf-text-azure.jsonl
